<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f3" />
    <meta name="description" content="Discipline OS — know what to do now, and enjoy finishing it." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Discipline OS</title>
    <script>
      // Apply the saved theme before the page paints, so dark mode never flashes white.
      (function () {
        try {
          var pref = localStorage.getItem("dos.theme");
          var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
