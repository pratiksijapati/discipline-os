# Render blueprint for the Discipline OS API.
# Render → New → Blueprint → pick this repo. Values marked `sync: false`
# are asked for once in the Render dashboard and never stored in git.

services:
  - type: web
    name: discipline-os-api
    runtime: python
    plan: free
    rootDir: backend
    # The free plan has no pre-deploy step, so migrations run at the end of the build.
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: REMINDER_CRON_SECRET
        generateValue: true
      # Neon → Connection string (pooled), ending in ?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DB_DISABLE_SERVER_SIDE_CURSORS
        value: "True"
      # The Vercel address, e.g. https://discipline-os.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
